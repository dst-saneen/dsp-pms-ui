name: Repository hygiene

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Test repository hygiene rules
        run: node --test scripts/repository-hygiene.test.mjs
      - name: Check tracked repository content
        run: node scripts/repository-hygiene.mjs
