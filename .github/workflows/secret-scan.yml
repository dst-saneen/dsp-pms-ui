name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Scan tracked files for credential-shaped secrets
        run: node scripts/secret-scan.mjs
